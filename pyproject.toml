[project]
name = "finance-sync"
version = "0.1.0"
description = "Modular homelab service syncing IBKR and Trade Republic transactions and portfolio valuations to BudgetBakers Wallet"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sebastjan Mevlja" }]
dependencies = [
    "httpx>=0.27.2",
    "ibflex2>=0.16.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.2",
    "pytr>=0.4.2",
    "websockets>=13.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11.2",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.1",
    "ruff>=0.6.9",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["config", "shared", "ibkr_worker", "tr_worker", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "ANN",    # flake8-annotations (enforce type hints)
    "S",      # flake8-bandit (security checks)
    "PT",     # flake8-pytest-style
    "RUF",    # ruff-specific rules
]
ignore = [
    "ANN401", # allow Any for dynamic JSON/WebSocket boundaries
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",   # allow assert in tests
    "S105",   # allow mock token strings in tests
    "S106",   # allow mock password arguments in tests
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["ibflex.*", "pytr.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -q"
